name: Build - ROM Generation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

jobs:
  build-rom:
    name: Build Game Boy ROM
    runs-on: ubuntu-latest
    # Only run on PRs and main branch pushes (not feature branches)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0  # Full history for proper LFS checkout

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install GB Studio CLI
        run: |
          # Note: GB Studio CLI installation method depends on platform
          # This is a placeholder - actual implementation needed
          echo "GB Studio CLI installation would go here"
          echo "For now, marking as informational build"

      - name: Check Makefile syntax
        run: |
          make --dry-run build-dirs

      - name: Validate project structure
        run: |
          # Check that required files exist
          test -f "BARRY-SHARP-PRO-MOVER-1.gbsproj"
          test -d "assets"
          test -d "scripts"

      - name: Run validation scripts
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e .

          # Run validations
          if [ -d "project/scenes" ]; then
            python3 scripts/validation/check_scene_limits.py project/scenes/ || true
          fi

      # Note: Actual ROM build requires GB Studio CLI which is not easily
      # installable in CI. This workflow validates the build process can run.

      - name: Create build artifact placeholder
        run: |
          mkdir -p build
          echo "ROM build validated - actual build requires GB Studio CLI" > build/README.txt

      - name: Upload build validation
        uses: actions/upload-artifact@v4
        with:
          name: build-validation
          path: build/README.txt
          retention-days: 7
