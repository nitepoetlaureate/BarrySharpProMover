name: CI - Tests and Quality

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          ruff check .
          ruff format --check .

      - name: Run type checking
        run: mypy .

      - name: Run tests with coverage
        run: |
          pytest --cov=.langflow --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run Python security audit
        run: pip-audit --desc

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r .langflow/ scripts/ -ll

  validate-assets:
    name: Validate Game Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Validate scene limits
        run: |
          if [ -d "project/scenes" ]; then
            python scripts/validation/check_scene_limits.py project/scenes/
          fi

      - name: Validate background tiles
        run: |
          if ls assets/backgrounds/*.png 1> /dev/null 2>&1; then
            python scripts/validation/check_bg_tiles.py assets/backgrounds/*.png
          fi

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -exec jq . {} \;
