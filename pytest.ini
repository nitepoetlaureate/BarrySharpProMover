[pytest]
# Pytest Configuration for BarrySharpProMover

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=scripts/validation
    --cov=scripts/logging_config.py
    --cov=scripts/validate_all.py
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=50

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, test component interaction)
    slow: Slow tests that take significant time
    requires_gbstudio: Tests that require GB Studio CLI to be configured
    requires_assets: Tests that require asset files to be present

# Coverage options
[coverage:run]
source = scripts/validation,scripts/logging_config.py,scripts/validate_all.py
omit =
    */tests/*
    */venv/*
    */langflow_env/*
    */__pycache__/*
    */site-packages/*
    */validation_template.py
    scripts/validation/validation_template.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
