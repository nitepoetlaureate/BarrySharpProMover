[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barrysharp-components"
version = "0.1.0"
description = "Custom LangFlow components for Barry Sharp Pro Mover GB Studio game"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langflow>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.setuptools]
# Custom components are in .langflow/components/
# This non-standard location is used by LangFlow's component discovery system
packages = []

[tool.setuptools.package-dir]
# Components will be discovered by LangFlow from .langflow/components/

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=.langflow --cov-report=html --cov-report=term-missing --verbose"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false

